  </g>
  <g fill="#e5e7eb">
    <rect x="80" y="460" width="435" height="12" rx="6"/>
    <rect x="80" y="492" width="400" height="12" rx="6"/>
    <rect x="80" y="524" width="420" height="12" rx="6"/>
    <rect x="80" y="556" width="300" height="12" rx="6"/>
  </g>
  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#374151" font-size="16">
    <text x="80" y="720">甲方代表簽章：</text>
    <text x="330" y="720">乙方代表簽章：</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="80" y1="770" x2="270" y2="770"/>
    <line x1="330" y1="770" x2="515" y2="770"/>
  </g>
</svg>
