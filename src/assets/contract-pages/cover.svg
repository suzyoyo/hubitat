<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842">
  <!-- 合約封面頁的示意圖（示範用，不是真的合約）：真的上線時換成後端從 PDF 轉出來的圖片 -->
  <rect width="595" height="842" fill="#ffffff"/>
  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#1f2937" text-anchor="middle">
    <text x="297.5" y="150" font-size="34" font-weight="700">廠商服務合約書</text>
    <text x="297.5" y="196" font-size="18" fill="#6b7280">（示意頁面・示範用）</text>
  </g>
  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#374151" font-size="18">
    <text x="80" y="300">甲方：翠峰閣社區管理委員會</text>
    <text x="80" y="345">乙方：＿＿＿＿＿＿＿＿＿＿</text>
